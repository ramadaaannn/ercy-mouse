<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة GPA</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; }
        button { padding: 10px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
  <h1>ercymouse | Ramadan Mohammed</h1>
    <h2>حاسبة المعدل التراكمي (GPA)</h2>
    <table>
        <thead>
            <tr>
                <th>المادة</th>
                <th>عدد الساعات</th>
                <th>التقدير</th>
            </tr>
        </thead>
        <tbody id="subjects">
            <tr>
                <td>رياضيات الأعمال</td>
                <td>3</td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>مبادئ إدارة الأعمال</td>
                <td>3</td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>مبادئ المحاسبة المالية</td>
                <td>3</td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>مبادئ الاقتصاد</td>
                <td>3</td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>اللغة الإنجليزية</td>
                <td>3</td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
        </tbody>
    </table>
    <button onclick="calculateGPA()">حساب GPA</button>
    <h3 id="result"></h3>

    <script>
        function calculateGPA() {
            let rows = document.querySelectorAll("#subjects tr");
            let totalPoints = 0, totalHours = 0;

            rows.forEach(row => {
                let hours = 3;
                let grade = parseFloat(row.cells[2].querySelector("select").value);
                totalPoints += hours * grade;
                totalHours += hours;
            });

            let gpa = totalHours ? (totalPoints / totalHours).toFixed(2) : 0;
            document.getElementById("result").innerText = "المعدل التراكمي (GPA): " + gpa;
        }
    </script>
</body>
</html>
