<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة GPA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffcc00;
        }
        h2 {
            color: #ffcc00;
        }
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            border: 1px solid #333;
        }
        th {
            background-color: #ffcc00;
            color: #121212;
        }
        input, select, button {
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        input {
            width: 50px;
            text-align: center;
            background: #333;
            color: #ffcc00;
        }
        select {
            background: #333;
            color: #ffcc00;
        }
        button {
            background-color: #ffcc00;
            color: #121212;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #ff9900;
        }
        @media (max-width: 768px) {
            table {
                width: 100%;
            }
            th, td {
                padding: 10px;
                font-size: 14px;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Ercymouse | Ramadan Mohammed</h1>
    <h2>حاسبة المعدل التراكمي (GPA)</h2>
    <table>
        <thead>
            <tr>
                <th>المادة</th>
                <th>عدد الساعات</th>
                <th>التقدير</th>
            </tr>
        </thead>
        <tbody id="subjects">
            <tr>
                <td>رياضيات الأعمال</td>
                <td><input type="number" value="3" min="1"></td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>مبادئ إدارة الأعمال</td>
                <td><input type="number" value="3" min="1"></td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>مبادئ المحاسبة المالية</td>
                <td><input type="number" value="3" min="1"></td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>مبادئ الاقتصاد</td>
                <td><input type="number" value="3" min="1"></td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>اللغة الإنجليزية</td>
                <td><input type="number" value="3" min="1"></td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
            <!-- إضافة المادة "d" -->
            <tr>
                <td>d</td>
                <td><input type="number" value="3" min="1"></td>
                <td>
                    <select>
                        <option value="4.0">A+</option>
                        <option value="3.7">A</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">C+</option>
                        <option value="2.3">C</option>
                        <option value="2.0">D</option>
                        <option value="0">F</option>
                    </select>
                </td>
            </tr>
        </tbody>
    </table>
    <button onclick="calculateGPA()">حساب GPA</button>
    <h3 id="result"></h3>
    <script>
        function calculateGPA() {
            let rows = document.querySelectorAll("#subjects tr");
            let totalPoints = 0, totalHours = 0;
            rows.forEach(row => {
                let hours = parseInt(row.cells[1].querySelector("input").value);
                let grade = parseFloat(row.cells[2].querySelector("select").value);
                totalPoints += hours * grade;
                totalHours += hours;
            });
            let gpa = totalHours ? (totalPoints / totalHours).toFixed(2) : 0;
            document.getElementById("result").innerText = "المعدل التراكمي (GPA): " + gpa;
        }
    </script>
</body>
</html>
